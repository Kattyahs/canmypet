spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/auth/**, /api/users/**

        - id: pet-service
          uri: ${PET_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/pets/**, /api/search-history/**

        - id: food-service
          uri: ${FOOD_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/foods/**, /api/food-safety/**, /api/faq/**, /api/emergency/**

server:
  port: ${GATEWAY_PORT:8080}

jwt:
  secret: ${JWT_SECRET}