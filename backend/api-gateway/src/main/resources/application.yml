spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**, /api/users/**

        - id: pet-service
          uri: ${PET_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/pets/**, /api/search-history/**

        - id: food-service
          uri: ${FOOD_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/foods/**, /api/food-safety/**, /api/faq/**, /api/emergency/**

server:
  port: ${GATEWAY_PORT:8080}

jwt:
  secret: ${JWT_SECRET}