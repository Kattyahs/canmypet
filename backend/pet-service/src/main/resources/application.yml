spring:
  application:
    name: pet-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${PET_SERVICE_DB:canmypet_pets}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${PET_SERVICE_PORT:8082}

jwt:
  secret: ${JWT_SECRET}

app:
  storage:
    pet-photos-dir: ${PET_PHOTOS_DIR:./data/pet-photos}

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8081}